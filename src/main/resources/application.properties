server.port=8081
spring.application.name=location-gateway
postcode.io.gateway.url=${POSTCODE_IO_GATEWAY_URL:http://localhost:8082}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n
logging.level.com.jobseekercopilot=${APP_LOG_LEVEL:INFO}
