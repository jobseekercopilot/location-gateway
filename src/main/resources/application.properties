server.port=8081
spring.application.name=location-gateway
postcode.io.gateway.url=${POSTCODE_IO_GATEWAY_URL:http://localhost:8082}
postcode.io.gateway.connect-timeout=${POSTCODE_GATEWAY_CONNECT_TIMEOUT:500ms}
postcode.io.gateway.read-timeout=${POSTCODE_GATEWAY_READ_TIMEOUT:5s}
postcode.io.gateway.max-attempts=${POSTCODE_GATEWAY_MAX_ATTEMPTS:2}
postcode.io.gateway.initial-backoff=${POSTCODE_GATEWAY_INITIAL_BACKOFF:100ms}
postcode.io.gateway.max-backoff=${POSTCODE_GATEWAY_MAX_BACKOFF:250ms}
postcode.io.gateway.circuit-failure-threshold=${POSTCODE_GATEWAY_CIRCUIT_FAILURE_THRESHOLD:5}
postcode.io.gateway.circuit-open-duration=${POSTCODE_GATEWAY_CIRCUIT_OPEN_DURATION:30s}
location.lookup.cache-ttl=${LOCATION_CACHE_TTL:15m}
location.lookup.cache-maximum-entries=${LOCATION_CACHE_MAXIMUM_ENTRIES:10000}
location.lookup.rate-maximum-requests=${LOCATION_RATE_MAXIMUM_REQUESTS:120}
location.lookup.rate-window=${LOCATION_RATE_WINDOW:1m}
location.lookup.rate-maximum-tracked-callers=${LOCATION_RATE_MAXIMUM_TRACKED_CALLERS:20000}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n
logging.level.com.jobseekercopilot=${APP_LOG_LEVEL:INFO}
