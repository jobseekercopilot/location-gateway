openapi: 3.0.3
info:
  title: Job Seeker Copilot Location Service Internal API
  version: 1.0.0
  description: Provider-neutral internal location normalisation and transient commute routing.
servers:
  - url: http://location-service:8104
security:
  - serviceToken: []
tags:
  - name: Location
  - name: Commute
paths:
  /internal/v1/locations/autocomplete:
    post:
      tags: [Location]
      operationId: autocompleteLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutocompleteRequest'
      responses:
        '200':
          description: Bounded provider-neutral suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutocompleteResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
  /internal/v1/locations/resolve:
    post:
      tags: [Location]
      operationId: resolveLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
      responses:
        '200':
          description: Canonical location or explicit confirmation requirement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
  /internal/v1/postcodes/{postcode}:
    get:
      tags: [Location]
      operationId: lookupPostcode
      parameters:
        - name: postcode
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 8
      responses:
        '200':
          description: Canonical Postcodes.io-backed location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalLocation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
  /internal/v1/commutes/matrix:
    post:
      tags: [Commute]
      operationId: estimateCommutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommuteMatrixRequest'
      responses:
        '200':
          description: Transient provider-neutral route estimates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommuteMatrixResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
  responses:
    Error:
      description: Stable redacted error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: integer
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    AutocompleteRequest:
      type: object
      required: [input]
      properties:
        input:
          type: string
          minLength: 3
          maxLength: 200
        sessionId:
          type: string
          format: uuid
          nullable: true
        countryCodes:
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 2
    AutocompleteResponse:
      type: object
      required: [sessionId, suggestions, attribution, source]
      properties:
        sessionId:
          type: string
          format: uuid
        suggestions:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Suggestion'
        attribution:
          $ref: '#/components/schemas/Attribution'
        source:
          type: string
          enum: [GOOGLE_PLACES, POSTCODES_IO]
    Suggestion:
      type: object
      required: [suggestionId, primaryText, precisionHint]
      properties:
        suggestionId:
          type: string
        primaryText:
          type: string
        secondaryText:
          type: string
          nullable: true
        precisionHint:
          $ref: '#/components/schemas/Precision'
    Attribution:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
        provider:
          type: string
          nullable: true
          enum: [GOOGLE_MAPS]
    ResolveRequest:
      type: object
      required: [sessionId, suggestionId]
      properties:
        sessionId:
          type: string
          format: uuid
        suggestionId:
          type: string
    ResolveResponse:
      type: object
      required: [location, resolutionStatus, attribution]
      properties:
        location:
          $ref: '#/components/schemas/CanonicalLocation'
        resolutionStatus:
          type: string
          enum: [RESOLVED, CONFIRMATION_REQUIRED]
        attribution:
          $ref: '#/components/schemas/Attribution'
        reasonCode:
          type: string
          nullable: true
    CanonicalLocation:
      type: object
      required:
        - locationId
        - displayName
        - countryCode
        - locationType
        - precision
        - confidence
        - providerReferences
        - fieldProvenance
        - normalisedAt
      properties:
        locationId:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 200
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
        postcode:
          type: string
          nullable: true
        locality:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
        locationType:
          type: string
          enum: [POSTCODE, LOCALITY, ADDRESS, WORKPLACE, REMOTE, UNKNOWN]
        precision:
          $ref: '#/components/schemas/Precision'
        confidence:
          $ref: '#/components/schemas/Confidence'
        providerReferences:
          type: array
          items:
            $ref: '#/components/schemas/ProviderReference'
        fieldProvenance:
          type: array
          items:
            $ref: '#/components/schemas/FieldProvenance'
        normalisedAt:
          type: string
          format: date-time
    ProviderReference:
      type: object
      required: [provider, observedAt]
      properties:
        provider:
          $ref: '#/components/schemas/Provider'
        externalId:
          type: string
          nullable: true
        observedAt:
          type: string
          format: date-time
    FieldProvenance:
      type: object
      required: [field, source, method, observedAt, confidence]
      properties:
        field:
          type: string
        source:
          $ref: '#/components/schemas/Provider'
        method:
          type: string
          enum: [DIRECT, USER_CONFIRMED, LOOKUP_VERIFIED, INFERRED]
        observedAt:
          type: string
          format: date-time
        confidence:
          $ref: '#/components/schemas/Confidence'
    CommuteMatrixRequest:
      type: object
      required: [origin, destinations, modes, departureTime]
      properties:
        origin:
          $ref: '#/components/schemas/RoutePoint'
        destinations:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/RoutePoint'
        modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TravelMode'
        departureTime:
          type: string
          format: date-time
    RoutePoint:
      type: object
      required: [referenceId, latitude, longitude, precision]
      properties:
        referenceId:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        precision:
          $ref: '#/components/schemas/Precision'
    CommuteMatrixResponse:
      type: object
      required: [estimates]
      properties:
        estimates:
          type: array
          items:
            $ref: '#/components/schemas/CommuteEstimate'
    CommuteEstimate:
      type: object
      required: [destinationReferenceId, mode, status, calculatedFor]
      properties:
        destinationReferenceId:
          type: string
        mode:
          $ref: '#/components/schemas/TravelMode'
        status:
          type: string
          enum: [ESTIMATED, APPROXIMATE, UNAVAILABLE]
        durationMinutes:
          type: integer
          nullable: true
          minimum: 0
        distanceMiles:
          type: number
          format: double
          nullable: true
          minimum: 0
        calculatedFor:
          type: string
          format: date-time
        reasonCode:
          type: string
          nullable: true
        providerAttribution:
          type: string
          nullable: true
          enum: [GOOGLE_MAPS]
    Precision:
      type: string
      enum: [EXACT_ADDRESS, POSTCODE_CENTROID, LOCALITY_CENTROID, PROVIDER_COORDINATE, NONE]
    Confidence:
      type: string
      enum: [VERIFIED, PROVIDED, INFERRED, AMBIGUOUS, UNKNOWN]
    Provider:
      type: string
      enum: [GOOGLE_PLACES, POSTCODES_IO, JOB_PROVIDER, USER, LEGACY]
    TravelMode:
      type: string
      enum: [DRIVE, TRANSIT]

