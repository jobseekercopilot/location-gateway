openapi: 3.0.1
info:
  title: Jobseeker Copilot - Postcode.io Gateway API
  version: 2.0.0
  description: Consumer contract used by location-gateway.
x-source-repository: jobseekercopilot/postcode-io-gateway
x-source-revision: f5588e5b0a2ca9e63319674f4b6cd40048b9e0fb
x-source-contract-sha256: 8321009c305d2d22986224e366df6f0b451c1b5587d05dd0ec4876441e09d7ff
paths:
  /api/places:
    get:
      tags: [Postcode]
      operationId: searchPlaces
      parameters:
        - name: q
          in: query
          required: true
          description: Validated UK place-name query
          schema:
            type: string
            minLength: 2
            maxLength: 80
        - name: limit
          in: query
          required: true
          description: Maximum number of results
          schema:
            type: integer
            minimum: 1
            maximum: 10
      responses:
        '200':
          description: Bounded matching places, possibly empty
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/PlaceLocation'
        '400':
          description: Invalid place query or limit
        '429':
          description: Provider rate limited
        '502':
          description: Provider returned an invalid response
        '503':
          description: Place search unavailable
        '504':
          description: Provider timed out
  /api/postcodes/{postcode}:
    get:
      tags: [Postcode]
      operationId: getLocationByPostcode
      parameters:
        - name: postcode
          in: path
          required: true
          description: UK postcode or outcode
          schema:
            type: string
      responses:
        '200':
          description: Postcode location found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostcodeLocation'
        '400':
          description: Invalid UK postcode or outcode
        '404':
          description: Postcode not found
        '422':
          description: Postcode area is outside approved coverage
        '429':
          description: Provider rate limited
        '502':
          description: Provider returned an invalid response
        '503':
          description: Postcode service unavailable
        '504':
          description: Postcode service timed out
        '500':
          description: Unexpected postcode service failure
components:
  schemas:
    PlaceLocation:
      type: object
      required: [id, name, postcode, region, latitude, longitude]
      properties:
        id:
          type: string
        name:
          type: string
        postcode:
          type: string
          description: Representative outward postcode
        region:
          type: string
        adminDistrict:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    PostcodeLocation:
      type: object
      properties:
        postcode:
          type: string
        country:
          type: string
        region:
          type: string
        parliamentary_constituency:
          type: string
        eastings:
          type: string
        northings:
          type: string
        longitude:
          type: number
          format: double
        latitude:
          type: number
          format: double
        european_electoral_region:
          type: string
        primary_care_trust:
          type: string
        nhs_ha:
          type: string
        admin_county:
          type: string
        admin_district:
          type: string
        admin_ward:
          type: string
